server.port=${PEDIDO_PORT:8083}

# Base de Datos PostgreSQL
spring.datasource.url=${DB_PEDIDO_URL:jdbc:postgresql://localhost:5432/delivery_pedido_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Calibración HikariCP para Pruebas de Estrés y Alta Concurrencia
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (Misma clave secreta compartida)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# URL de microservicio de comercios para verificación y descuento de stock
services.comercio.url=${COMERCIO_SERVICE_URL:http://localhost:8082}
