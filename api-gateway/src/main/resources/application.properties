server.port=${GATEWAY_PORT:8000}

# URLs de los microservicios destino
gateway.services.auth=${AUTH_SERVICE_URL:http://localhost:8081}
gateway.services.comercio=${COMERCIO_SERVICE_URL:http://localhost:8082}
gateway.services.pedido=${PEDIDO_SERVICE_URL:http://localhost:8083}

# Calibración de servidor para alta concurrencia
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.connection-timeout=20000
